name: ci-cd

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install project and test tooling
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run pytest

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write

    outputs:
      released: ${{ steps.release_status.outputs.released }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install project and release tooling
        run: uv sync --all-extras

      - name: Compute release status
        id: release_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_VERSION="$(uv run semantic-release version --print-last-released 2>/dev/null || true)"
          NEXT_VERSION="$(uv run semantic-release version --print)"

          if [ -z "$NEXT_VERSION" ] || [ "$NEXT_VERSION" = "$LAST_VERSION" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create release commit, tag, and changelog
        if: steps.release_status.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release version

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/llmframe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install project and release tooling
        run: uv sync --all-extras

      - name: Build release artifacts from released version
        run: uv build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
