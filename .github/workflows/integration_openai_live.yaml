name: integration-openai-live

'on':
  workflow_dispatch:
    inputs:
      target:
        description: Live integration test target to execute.
        required: true
        default: all
        type: choice
        options:
          - all
          - text_generation
          - structured_extraction
          - batch_submission
          - batch_result_retrieval
      python_version:
        description: Python version to use for the run.
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      model:
        description: OpenAI model override for the run.
        required: false
        default: gpt-5.4-nano
        type: string
      base_url:
        description: OpenAI base URL override for the run.
        required: false
        default: https://api.openai.com/v1
        type: string
      batch_id:
        description: Batch ID override for retrieval runs.
        required: false
        default: ""
        type: string
      batch_wait_timeout_seconds:
        description: Batch wait timeout, in seconds.
        required: false
        default: "120"
        type: string
      batch_poll_interval_seconds:
        description: Batch poll interval, in seconds.
        required: false
        default: "5"
        type: string

jobs:
  openai-live-integration:
    name: OpenAI live integration (${{ inputs.target }}, Python ${{ inputs.python_version }})
    runs-on: ubuntu-latest
    env:
      LLMFRAME_RUN_ON_DEMAND_INTEGRATION: "1"
      LLMFRAME_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLMFRAME_OPENAI_MODEL: ${{ inputs.model }}
      LLMFRAME_OPENAI_BASE_URL: ${{ inputs.base_url }}
      LLMFRAME_TEST_BATCH_ID: ${{ inputs.batch_id }}
      LLMFRAME_BATCH_WAIT_TIMEOUT_SECONDS: ${{ inputs.batch_wait_timeout_seconds }}
      LLMFRAME_BATCH_POLL_INTERVAL_SECONDS: ${{ inputs.batch_poll_interval_seconds }}
      LLMFRAME_PYTEST_HTML_REPORT: test_results/integration-openai-live-report.html

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Sync project dependencies
        run: uv sync --all-extras --python ${{ inputs.python_version }}

      - name: Validate required OpenAI secret
        run: |
          if [ -z "${LLMFRAME_OPENAI_API_KEY}" ]; then
            echo "Repository secret OPENAI_API_KEY must be configured to run live integration tests." >&2
            exit 1
          fi

      - name: Select pytest target
        id: pytest_target
        run: |
          case "${{ inputs.target }}" in
            all)
              target_path='tests/integration/openai_live'
              ;;
            text_generation)
              target_path='tests/integration/openai_live/test_text_generation.py'
              ;;
            structured_extraction)
              target_path='tests/integration/openai_live/test_structured_extraction.py'
              ;;
            batch_submission)
              target_path='tests/integration/openai_live/test_batch_submission.py'
              ;;
            batch_result_retrieval)
              target_path='tests/integration/openai_live/test_batch_result_retrieval.py'
              ;;
            *)
              echo "Unsupported target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac

          echo "command=uv run pytest -m \"integration and on_demand\" --html=\"${LLMFRAME_PYTEST_HTML_REPORT}\" --self-contained-html ${target_path}" >> "$GITHUB_OUTPUT"

      - name: Run selected live integration tests
        run: ${{ steps.pytest_target.outputs.command }}

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-openai-live-report-${{ inputs.target }}-py${{ inputs.python_version }}
          path: ${{ env.LLMFRAME_PYTEST_HTML_REPORT }}
          if-no-files-found: warn
