[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-llmframe"
version = "0.1.0"
description = "Hexagonal Python application scaffold for py-llmframe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmframe"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D1",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/llmframe/adapters/output/llm/llm_adapter/adapter.py" = ["ANN401"]
"src/llmframe/adapters/output/llm/llm_adapter/logging_utils.py" = ["ANN401"]
"src/llmframe/adapters/output/llm/openai_adapter/transport/adapter.py" = ["PLR0913"]
"src/llmframe/adapters/output/llm/openai_adapter/transport/protocols.py" = ["PLR0913"]
"tests/unit/adapters/output/llm/llm_adapter/test_adapter.py" = ["PLR0913", "PLR2004"]
"tests/unit/adapters/output/llm/openai_adapter/transport/test_adapter.py" = ["PLR0913", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
